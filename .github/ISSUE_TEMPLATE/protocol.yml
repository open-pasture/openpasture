name: Protocol question
description: Building a collar, a server or a tool that speaks the collar protocol.
labels: [protocol]
body:
  - type: markdown
    attributes:
      value: |
        The protocol spec, schemas and test vectors live in
        [open-pasture/opencollar](https://github.com/open-pasture/opencollar/tree/main/protocol).
        Questions about the spec itself are best asked there; questions about how openpasture
        implements it belong here.
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What you're building, and what the spec or openpasture's behaviour left unclear.
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Spec section or endpoint
      placeholder: "e.g. POST /collar/v1/report, boundary signing"
  - type: textarea
    id: example
    attributes:
      label: Example message
      description: The request or command you sent and what came back. Remove keys first.
      render: json
