# cargo deny check: licences, security advisories, banned or duplicate crates,
# and where crates come from. CI runs it on every pull request.
#
# The Apache-2.0 crates (op-protocol, op-geo) must never depend on AGPL code,
# or collar firmware and other clients couldn't use them. CI checks that with
# `cargo tree` rooted at each of them (the `licences` job in ci.yml), since a
# deny.toml applies one licence list to the whole workspace.

[graph]
# The platforms we build and ship.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
all-features = false

[advisories]
# Vulnerabilities and unsound code fail anywhere in the graph. "Unmaintained"
# fails only for our direct dependencies: deep in tauri's and gtk's trees
# (proc-macro-error, zbus_names, zvariant) we can't act on it.
unmaintained = "workspace"
yanked = "deny"
ignore = [
    # Each entry: the advisory, why it doesn't apply, and the date to look
    # again ("review by YYYY-MM-DD" in its reason). CI fails once that date
    # passes (scripts/deny-ignores.py), so an ignore can't outlive its reason.
    #
    # zip < 9, now only zip 4 under tauri-plugin-updater (op-import is on
    # zip 9). Its newest stable release, 2.13.1, still asks for zip 4. The
    # updater opens a zip only on Windows (extract_zip, for .msi.zip and
    # .exe.zip bundles), after checking the update's signature; our updates
    # are tar.gz. It builds zip with no features, so no AES (0545), and it
    # never uses ZipStreamReader (0548). 0367-0369 and 0429 are bugs in
    # extract() to disk on untrusted archives. Drop these when
    # tauri-plugin-updater moves to zip 9.
    { id = "RUSTSEC-2026-0367", reason = "updater's zip 4, signed Windows bundles only; see above. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0368", reason = "updater's zip 4, signed Windows bundles only; see above. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0369", reason = "updater's zip 4, signed Windows bundles only; see above. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0429", reason = "updater's zip 4, signed Windows bundles only; see above. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0545", reason = "updater's zip 4 is built without aes-crypto. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0548", reason = "ZipStreamReader unused; updater reads with ZipArchive. review by 2027-01-31" },
    # SQLite < 3.54 (libsqlite3-sys < 0.39): a database opened with a -wal
    # file of a different page size can return stale memory. The fix needs
    # sqlx 0.9, whose SqlSafeStr check means auditing ~120 dynamic queries;
    # that's its own change. The server and desktop open only the database,
    # backups and session store in their own data folder, which they wrote;
    # nothing opens a SQLite file a user uploads. Drop this with sqlx 0.9.
    { id = "RUSTSEC-2026-0459", reason = "only our own data folder's databases are opened; see above. review by 2027-01-31" },
    # chrono and chrono-tz are unmaintained; no release fixes that. Moving
    # to jiff touches every crate. Not a vulnerability.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no replacement release; move to jiff is its own change. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained, no replacement release; move to jiff is its own change. review by 2027-01-31" },
    # zstd 0.13 / zstd-safe 7: fixed only in zstd 0.14.3 / zstd-safe 8.2,
    # which arrow-ipc and parquet 59 (datafusion 55) and tantivy-sstable 0.7
    # can't take (they ask for zstd ^0.13). All three call only zstd::bulk
    # (Compressor/Decompressor), never the stream encoders' and decoders'
    # with_context (0391), Seekable (0398) or DCtx::decompress_stream (0403).
    # The Parquet and index files they read are ones this server wrote.
    # Drop these when datafusion and tantivy move to zstd 0.14.
    { id = "RUSTSEC-2026-0391", reason = "stream with_context unused; bulk API only. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0398", reason = "Seekable unused; bulk API only. review by 2027-01-31" },
    { id = "RUSTSEC-2026-0403", reason = "decompress_stream unused; bulk API only. review by 2027-01-31" },
]

[licenses]
confidence-threshold = 0.93
# Permissive licences, plus the weak-copyleft MPL-2.0 (file-level, fine to
# link), and AGPL-3.0-only for openpasture's own crates.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
exceptions = [
    # Time zone boundaries from OpenStreetMap, compiled into the binary.
    # Credited in THIRD-PARTY-NOTICES.
    { crate = "tzf-dist", allow = ["ODbL-1.0"] },
]

[bans]
# Duplicates are common in a tree this size (datafusion, tauri); report them
# without failing.
multiple-versions = "warn"
# "deny" once every crate but op-protocol and op-geo sets publish = false
# (cargo-deny only exempts unpublished crates).
wildcards = "warn"
# Workspace path dependencies carry no version; that's fine.
allow-wildcard-paths = true
deny = [
    # OpenSSL: the tree is rustls + ring only, so builds need no system TLS.
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
