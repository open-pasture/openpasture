name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml runs this whole workflow on the tagged commit and publishes
  # nothing unless every required job here passes.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The opencollar commit whose protocol vectors op-protocol must match byte for
  # byte (scripts/compare-vectors.sh). Move it forward in the same pull request
  # that changes the vectors on either side. It must be a commit on GitHub.
  #
  # Empty: the comparison is skipped with a warning.
  OPENCOLLAR_REF: "798f5e719f6d5d0f45004d0b375fb90361c4d636"

# Actions are pinned to commit SHAs (Dependabot keeps them current). The Rust
# toolchain comes from rust-toolchain.toml and bun from .bun-version.

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - run: cargo fmt --all --check

  versions:
    name: versions agree
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Cargo.toml, Cargo.lock, tauri.conf.json and ui/package.json.
      - run: python3 scripts/set-version.py --check

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      # Packages that ship in the bundle: any advisory fails.
      - name: Audit shipped packages
        run: bun audit --prod
      # Dev tools (vite, typescript): high and critical fail.
      - name: Audit dev packages
        run: bun audit --audit-level=high

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Linux packages for the desktop crate
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # op-server embeds ui/dist; build it once up front.
      - name: Build UI
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # The server and the Apache crates build on Windows; the desktop app is macOS-only for now.
  windows:
    name: windows (server)
    runs-on: windows-2025
    timeout-minutes: 60
    # Not yet run green anywhere: a failure shows on the run but doesn't fail
    # it (or block a release) until it has. Remove this line once it has, and
    # add "windows (server)" to main's required checks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build UI
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui
      - run: cargo build --locked -p op-cli -p collar-sim
      - run: cargo test --locked -p op-protocol -p op-geo

  # Licences, advisories and banned crates (deny.toml); the Apache crates
  # never reach AGPL code; the notices a release ships can be generated.
  licences:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-deny@0.20.2,cargo-about@0.9.2
      - run: cargo deny --locked check
      # Every ignored advisory carries a review date; past it, this fails.
      - run: python3 scripts/deny-ignores.py
      - name: op-protocol and op-geo depend on no AGPL or GPL crate
        run: |
          for crate in op-protocol op-geo; do
            tree=$(cargo tree --locked -p "$crate" -e normal,build --prefix none --format '{p} {l}')
            echo "$tree"
            if grep -E 'GPL' <<<"$tree"; then
              echo "::error::$crate (Apache-2.0) depends on a GPL-family crate; see deny.toml"
              exit 1
            fi
          done
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: python3 scripts/third-party-notices.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-notices
          path: THIRD-PARTY-NOTICES
          if-no-files-found: error

  # op-protocol's test vectors are the collar firmware's and the spec's too:
  # every copy in opencollar must be byte-identical to ours, v1 and v2.
  vectors:
    name: protocol vectors
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned opencollar commit
        id: pin
        run: |
          if [ -z "$OPENCOLLAR_REF" ]; then
            echo "::warning title=Protocol vectors not compared::OPENCOLLAR_REF is empty in ci.yml, so op-protocol's vectors were not compared with opencollar's. Set it to the opencollar commit that carries them (see the comment there)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.pin.outputs.skip != 'true'
        with:
          repository: open-pasture/opencollar
          ref: ${{ env.OPENCOLLAR_REF }}
          path: opencollar
          persist-credentials: false
      - name: Compare vectors
        if: steps.pin.outputs.skip != 'true'
        run: scripts/compare-vectors.sh opencollar
