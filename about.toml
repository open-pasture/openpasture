# cargo about: the Rust half of THIRD-PARTY-NOTICES (scripts/third-party-notices.py).
# The licence list matches deny.toml's; cargo deny check fails first if a new
# licence turns up.
accepted = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
# The platforms we ship.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Only what ends up in a binary: build scripts, proc macros and test-only
# crates don't ship.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Time zone boundaries from OpenStreetMap, compiled in.
[tzf-dist]
accepted = ["ODbL-1.0"]
