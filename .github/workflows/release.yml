name: Release

# Push a tag like v0.1.0 on a commit whose version files already say 0.1.0
# (scripts/set-version.py, then commit). CI runs again on the tagged commit
# and must pass; then the first job stops the release if the versions
# disagree. See docs/RELEASING.md.
#
# Actions are pinned to commit SHAs. The signing secrets live in the `release`
# environment (a maintainer approves each run) and are given only to the steps
# that use them.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/open-pasture/openpasture
  TAURI_CLI: "@tauri-apps/cli@2.12.4"

jobs:
  # The whole CI workflow, on exactly the tagged commit: formatting, clippy,
  # every test on Linux and macOS, the UI, licences and advisories, protocol
  # vectors. Nothing below runs (nothing is built, signed or published)
  # unless it passes.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  # The tag matches the repo, and the licence notices every artefact ships.
  prepare:
    name: Version and notices
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the version files
        run: python3 scripts/set-version.py --check "$GITHUB_REF_NAME"
      - run: rustup toolchain install --no-self-update
      - uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cargo-about@0.9.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
        working-directory: ui
      - run: python3 scripts/third-party-notices.py
      # The release notes are the CHANGELOG section for this version.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## " v "( |$)" {f=1; next} /^## /{f=0} f' CHANGELOG.md \
            | sed -e '/./,$!d' > changes.md
          if [ ! -s changes.md ]; then
            echo "::warning::CHANGELOG.md has no section for $version; the release notes list only the downloads."
          fi
          cat changes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices
          path: |
            THIRD-PARTY-NOTICES
            changes.md
          if-no-files-found: error

  macos-desktop:
    name: macOS desktop (universal, signed, notarized)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    steps:
      # Never ship an unsigned app: stop here if any signing secret is missing.
      - name: Check signing secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY KEYCHAIN_PASSWORD \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Signing secrets missing::Missing secrets: ${missing[*]}. The macOS app and its updates are only released signed (and the app notarized). Add them to the release environment as described in docs/RELEASING.md, then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Third-party actions run before any key is on the runner.
      - name: Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: universal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices

      - name: Build UI
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error title=Signing identity not found::APPLE_SIGNING_IDENTITY does not match a codesigning identity in APPLE_CERTIFICATE."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      # Tauri signs with APPLE_SIGNING_IDENTITY (the config's "-" is only for
      # local builds) and notarizes the .app with the API key, then staples it.
      # It then packs the stapled .app as openpasture.app.tar.gz for the
      # updater and signs that with TAURI_SIGNING_PRIVATE_KEY. The licence
      # files go into Contents/Resources.
      - name: Build, sign and notarize
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          config=$(jq -nc --arg id "$APPLE_SIGNING_IDENTITY" '{bundle: {
            createUpdaterArtifacts: true,
            macOS: {signingIdentity: $id},
            resources: {"../../../THIRD-PARTY-NOTICES": "THIRD-PARTY-NOTICES", "../../../LICENSE": "LICENSE", "../../../NOTICE": "NOTICE"}}}')
          bunx "$TAURI_CLI" build --target universal-apple-darwin --bundles app,dmg --config "$config"

      - name: Sign, notarize and staple the DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=target/universal-apple-darwin/release/bundle
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "::error::No .dmg in $bundle/dmg"; exit 1; }
          mkdir -p out
          cp "$dmg" out/openpasture-macos.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" out/openpasture-macos.dmg
          xcrun notarytool submit out/openpasture-macos.dmg \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 60m
          xcrun stapler staple out/openpasture-macos.dmg
          cp out/openpasture-macos.dmg "out/openpasture-${version}-macos-universal.dmg"

      # Nothing after this needs a key; remove them before any later action runs.
      - name: Remove keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      # The installed apps read latest.json from releases/latest; it points
      # at this tag's archive. A universal build serves both architectures.
      - name: Update archive and latest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive=target/universal-apple-darwin/release/bundle/macos/openpasture.app.tar.gz
          [ -f "$archive" ] && [ -f "$archive.sig" ] || { echo "::error::No signed updater archive at $archive"; exit 1; }
          cp "$archive" out/openpasture-macos.app.tar.gz
          cp "$archive.sig" out/openpasture-macos.app.tar.gz.sig
          url="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/openpasture-macos.app.tar.gz"
          notes="openpasture $version"
          [ -s changes.md ] && notes=$(cat changes.md)
          jq -n --arg version "$version" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg sig "$(cat "$archive.sig")" --arg url "$url" --arg notes "$notes" \
            '{version: $version, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $sig, url: $url}, "darwin-x86_64": {signature: $sig, url: $url}}}' \
            > out/latest.json
          cat out/latest.json

      - name: Verify
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/openpasture.app
          lipo -info "$app/Contents/MacOS/openpasture-desktop"
          lipo "$app/Contents/MacOS/openpasture-desktop" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 out/openpasture-macos.dmg
          xcrun stapler validate out/openpasture-macos.dmg
          for f in THIRD-PARTY-NOTICES LICENSE NOTICE; do
            test -s "$app/Contents/Resources/$f" || { echo "::error::$f is missing from the app bundle"; exit 1; }
          done
          # The app inside the update archive is the notarized, stapled one.
          mkdir "$RUNNER_TEMP/update" && tar -xzf out/openpasture-macos.app.tar.gz -C "$RUNNER_TEMP/update"
          codesign --verify --deep --strict "$RUNNER_TEMP/update/openpasture.app"
          xcrun stapler validate "$RUNNER_TEMP/update/openpasture.app"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-desktop
          path: |
            out/*.dmg
            out/openpasture-macos.app.tar.gz
            out/openpasture-macos.app.tar.gz.sig
            out/latest.json
          if-no-files-found: error

  server:
    name: Server ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 builds link glibc 2.35, so the binaries also run on
          # Debian 12 and Raspberry Pi OS (bookworm).
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install --no-self-update
          rustup target add ${{ matrix.target }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - name: Build UI
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p op-cli -p collar-sim
      - name: Package
        run: |
          scripts/package-server.sh ${{ matrix.target }} openpasture-server-${{ matrix.name }}
          tar -tzf out/openpasture-server-${{ matrix.name }}.tar.gz | grep -qx './THIRD-PARTY-NOTICES' \
            || { echo "::error::THIRD-PARTY-NOTICES is missing from the tarball"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.name }}
          path: out/*.tar.gz
          if-no-files-found: error

  docker:
    name: Docker ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Into the build context: the Dockerfile copies it to /usr/share/doc/openpasture.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
      - run: test -s THIRD-PARTY-NOTICES
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # No build-record artifact; the release job has no use for it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=openpasture server: collars, data, analytics and grazing decisions
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Save digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  # Tags are only moved once every build has passed.
  docker-manifest:
    name: Docker manifest
    needs: [docker, macos-desktop, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag version and latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "$IMAGE:$version")
          # A pre-release (v0.2.0-rc.1) does not move latest.
          [[ "$version" == *-* ]] || tags+=(-t "$IMAGE:latest")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"
      - name: The image carries the notices
        run: |
          version="${GITHUB_REF_NAME#v}"
          docker run --rm --entrypoint cat "$IMAGE:$version" /usr/share/doc/openpasture/THIRD-PARTY-NOTICES | head -n 3

  release:
    name: GitHub release
    needs: [macos-desktop, server, docker-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the release files: the Docker jobs also leave digest files and
      # build-record artifacts in this run, and the build records can't be
      # extracted by download-artifact.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          pattern: '{macos-desktop,server-*}'
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices
          path: notices
      - name: Checksums
        run: |
          cp notices/THIRD-PARTY-NOTICES assets/
          cd assets
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="${{ github.repository }}"
          {
            if [ -s notices/changes.md ]; then
              cat notices/changes.md
              echo
            fi
            cat <<NOTES
          ### Downloads

          - macOS app (Apple Silicon and Intel, signed and notarized): \`openpasture-macos.dmg\`. Installed apps offer this update themselves.
          - Server binaries with \`collar-sim\`, the simulator: \`openpasture-server-<os>-<arch>.tar.gz\` for linux-x64, linux-arm64, macos-arm64, macos-x64
          - Docker: \`docker pull ${IMAGE}:${version}\`

          Check downloads against \`SHA256SUMS\`. Third-party licences: \`THIRD-PARTY-NOTICES\` (also inside each download). Setup: https://github.com/${repo}#readme
          NOTES
          } > notes.md
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" assets/* "${flags[@]}" \
            --repo "$repo" --title "openpasture ${version}" --notes-file notes.md --verify-tag
