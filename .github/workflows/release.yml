name: Release

# Push a tag like v0.1.0. The tag is the version: every job writes it into
# Cargo.toml, Cargo.lock and tauri.conf.json before building.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/open-pasture/openpasture

jobs:
  macos-desktop:
    name: macOS desktop (universal, signed, notarized)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
    steps:
      # Never ship an unsigned app: stop here if any signing secret is missing.
      - name: Check Apple signing secrets
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_TEAM_ID \
                      APPLE_API_ISSUER APPLE_API_KEY APPLE_API_PRIVATE_KEY KEYCHAIN_PASSWORD; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error title=Apple signing secrets missing::Missing secrets: ${missing[*]}. The macOS app is only released signed and notarized. Add them as described in docs/RELEASING.md, then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set version from tag
        run: python3 scripts/set-version.py "$GITHUB_REF_NAME"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: universal

      - name: Import Developer ID certificate
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
          if ! security find-identity -v -p codesigning "$keychain" | grep -qF "$APPLE_SIGNING_IDENTITY"; then
            echo "::error title=Signing identity not found::APPLE_SIGNING_IDENTITY does not match a codesigning identity in APPLE_CERTIFICATE."
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi

      - name: Write App Store Connect API key
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "$APPLE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Build UI
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui

      # Tauri signs with APPLE_SIGNING_IDENTITY (the config's "-" is only for
      # local builds) and notarizes the .app with the API key, then staples it.
      - name: Build, sign and notarize
        working-directory: apps/desktop
        run: |
          # Tauri would import APPLE_CERTIFICATE into a second keychain; it is imported above.
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD
          config=$(jq -nc --arg id "$APPLE_SIGNING_IDENTITY" '{bundle: {macOS: {signingIdentity: $id}}}')
          bunx @tauri-apps/cli@^2 build --target universal-apple-darwin --bundles app,dmg --config "$config"

      - name: Sign, notarize and staple the DMG
        run: |
          version="${GITHUB_REF_NAME#v}"
          bundle=target/universal-apple-darwin/release/bundle
          dmg=$(find "$bundle/dmg" -name '*.dmg' | head -n 1)
          [ -n "$dmg" ] || { echo "::error::No .dmg in $bundle/dmg"; exit 1; }
          mkdir -p out
          cp "$dmg" out/openpasture-macos.dmg
          codesign --force --timestamp --sign "$APPLE_SIGNING_IDENTITY" out/openpasture-macos.dmg
          xcrun notarytool submit out/openpasture-macos.dmg \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 60m
          xcrun stapler staple out/openpasture-macos.dmg
          cp out/openpasture-macos.dmg "out/openpasture-${version}-macos-universal.dmg"

      - name: Verify
        run: |
          app=target/universal-apple-darwin/release/bundle/macos/openpasture.app
          lipo -info "$app/Contents/MacOS/openpasture-desktop"
          lipo "$app/Contents/MacOS/openpasture-desktop" -verify_arch arm64 x86_64
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=4 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type open --context context:primary-signature --verbose=4 out/openpasture-macos.dmg
          xcrun stapler validate out/openpasture-macos.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-desktop
          path: out/*.dmg
          if-no-files-found: error

      - name: Remove keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  server:
    name: Server ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 builds link glibc 2.35, so the binaries also run on
          # Debian 12 and Raspberry Pi OS (bookworm).
          - name: linux-x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - name: macos-x64
            runner: macos-15
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: python3 scripts/set-version.py "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build UI
        run: bun install --frozen-lockfile && bun run build
        working-directory: ui
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p op-cli -p collar-sim
      - name: Package
        run: scripts/package-server.sh ${{ matrix.target }} openpasture-server-${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: out/*.tar.gz
          if-no-files-found: error

  docker:
    name: Docker ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set version from tag
        run: python3 scripts/set-version.py "$GITHUB_REF_NAME"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        env:
          # No build-record artifact; the release job has no use for it.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=openpasture server: collars, data, analytics and grazing decisions
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ github.ref_name }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Save digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  # Tags are only moved once every build has passed.
  docker-manifest:
    name: Docker manifest
    needs: [docker, macos-desktop, server]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag version and latest
        working-directory: ${{ runner.temp }}/digests
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "$IMAGE:$version")
          # A pre-release (v0.2.0-rc.1) does not move latest.
          [[ "$version" == *-* ]] || tags+=(-t "$IMAGE:latest")
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          docker buildx imagetools inspect "$IMAGE:$version"

  release:
    name: GitHub release
    needs: [macos-desktop, server, docker-manifest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only the release files: the Docker jobs also leave digest files and
      # build-record artifacts in this run, and the build records can't be
      # extracted by download-artifact.
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: '{macos-desktop,server-*}'
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          repo="${{ github.repository }}"
          cat > notes.md <<NOTES
          openpasture ${version}.

          - macOS app (Apple Silicon and Intel, signed and notarized): \`openpasture-macos.dmg\`
          - Server binaries with \`collar-sim\`: \`openpasture-server-<os>-<arch>.tar.gz\` for linux-x64, linux-arm64, macos-arm64, macos-x64
          - Docker: \`docker pull ${IMAGE}:${version}\`

          Check downloads against \`SHA256SUMS\`. Setup: https://github.com/${repo}#readme
          NOTES
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" assets/* "${flags[@]}" \
            --repo "$repo" --title "openpasture ${version}" --notes-file notes.md --verify-tag
