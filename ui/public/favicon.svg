<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 5 5" shape-rendering="crispEdges">
  <!-- Served on its own, so it cannot read assets/landing.css: #0C0B09 is the bg token, #F5F1EA is fg, #FF6A2B is blaze. Change them with the tokens. Same pixel pattern as partials/mark.html, scripts/og-source.svg, and the rows array in scripts/render-images.js. -->
  <rect width="5" height="5" fill="#0C0B09"/><g fill="#F5F1EA"><rect x="0" y="0" width="3" height="1"/><rect x="0" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="0" y="2" width="3" height="1"/><rect x="3" y="3" width="2" height="1"/><rect x="3" y="4" width="1" height="1"/></g><rect x="4" y="4" width="1" height="1" fill="#FF6A2B"/>
</svg>
