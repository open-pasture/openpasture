version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One pull request for compatible updates; majors come one by one.
      cargo-minor:
        update-types: [minor, patch]

  - package-ecosystem: bun
    directories: [/ui, /apps/desktop]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bun-minor:
        update-types: [minor, patch]

  # Workflows pin actions to commit SHAs; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
